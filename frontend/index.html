    <script>
      // Перевірка версії застосунку
      (function() {
        fetch('/version.json?t=' + Date.now())
          .then(res => {
            const contentType = res.headers.get('content-type') || '';
            return res.ok && contentType.includes('application/json') ? res.json() : null;
          })
          .then(data => {
            if (!data) return;
            const currentVersion = localStorage.getItem('app_version');
            const currentBuildTime = localStorage.getItem('app_build_time');
            const nextBuildTime = data.buildTime ? String(data.buildTime) : '';
            if (
              data.version &&
              currentVersion &&
              (data.version !== currentVersion || (nextBuildTime && currentBuildTime && nextBuildTime !== currentBuildTime))
            ) {
              localStorage.setItem('app_version', data.version);
              if (nextBuildTime) localStorage.setItem('app_build_time', nextBuildTime);
              // Жорстке перезавантаження для оновлення кешу
              window.location.reload(true);
            } else if (data.version) {
              localStorage.setItem('app_version', data.version);
              if (nextBuildTime) localStorage.setItem('app_build_time', nextBuildTime);
            }
          })
          .catch(() => {});
      })();
    </script>




    <style>
      #portal-startup[hidden], #portal-startup [hidden] { display: none !important; }
      #portal-startup { position: fixed; inset: 0; z-index: 20000; display: flex; align-items: center; justify-content: center; padding: 24px; box-sizing: border-box; background: #f4f5f2; color: #333; font: 16px/1.5 system-ui, -apple-system, sans-serif; text-align: center; }

      #portal-startup p { margin: 8px 0; }

      #portal-startup-code { display: block; margin-top: 16px; font-size: 12px; opacity: .7; }
      #portal-startup-spinner { display: inline-block; width: 30px; height: 30px; border: 3px solid #d4d8c8; border-top-color: #7c961a; border-radius: 50%; animation: portal-startup-spin .9s linear infinite; }
      @keyframes portal-startup-spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { #portal-startup-spinner { animation: none; } }
      @media (prefers-color-scheme: dark) { #portal-startup { background: #292825; color: #f2f2eb; } }
